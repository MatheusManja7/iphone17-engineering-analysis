<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .wrapper {
            width: 50vw;
            height: 95vh;
            position: relative;
            overflow: hidden;
        }

        .wrapper iframe {
            position: absolute;
            top: -64px;
            left: 0;
            width: 100%;
            height: calc(100% + 130px);
            border: none;
            background: transparent;
        }

        .zoom-block {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: transparent;
            cursor: grab;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe
            id="sketchfab"
            title="iPhone 17 Pro Max"
            frameborder="0"
            allowfullscreen
            mozallowfullscreen="true"
            webkitallowfullscreen="true"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            xr-spatial-tracking
            execution-while-out-of-viewport
            execution-while-not-rendered
            web-share
            src="https://sketchfab.com/models/87fc1df741384124a8ce0226d2b2058d/embed?autostart=1&autospin=0.2&transparent=1&ui_controls=0&ui_infos=0&ui_watermark=0&ui_ar=0&ui_help=0&ui_settings=0&ui_vr=0&ui_fullscreen=0&ui_annotations=0&preload=1">
        </iframe>
        <div class="zoom-block" id="zoomBlock"></div>
    </div>

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
    <script>
        const iframe = document.getElementById('sketchfab');
        const client = new Sketchfab(iframe);

        client.init('87fc1df741384124a8ce0226d2b2058d', {
            success: function(api) {
                api.start();
                api.addEventListener('viewerready', function() {
                    // Afasta a câmera para o modelo aparecer menor
                    api.getCameraLookAt(function(err, camera) {
                        if (!err) {
                            const eye = camera.position;
                            const target = camera.target;

                            // Controle de Distância
                            const scale = 1.0;
                            const newEye = [
                                target[0] + (eye[0] - target[0]) * scale,
                                target[1] + (eye[1] - target[1]) * scale,
                                target[2] + (eye[2] - target[2]) * scale
                            ];

                            api.setCameraLookAt(newEye, target, 0);
                            api.setUserInteraction(false); // Desativa zoom e pan
                            api.setUserInteraction(true);  // Reativa só rotação
                        }
                    });
                });
            },
            error: function() {
                console.log('Sketchfab API error');
            },
            autospin: 0.6,
            transparent: 1,
            ui_controls: 0,
            ui_infos: 0,
            ui_watermark: 0,
            ui_ar: 0,
            ui_help: 0,
            ui_settings: 0,
            ui_vr: 0,
            ui_fullscreen: 0,
            ui_annotations: 0,
            preload: 1
        });

        // Bloqueia zoom
        const block = document.getElementById('zoomBlock');

        block.addEventListener('wheel', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, { passive: false });

        block.addEventListener('mousedown', () => {
            block.style.pointerEvents = 'none';
        });

        document.addEventListener('mouseup', () => {
            setTimeout(() => block.style.pointerEvents = 'auto', 50);
        });

        block.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) block.style.pointerEvents = 'none';
        });

        block.addEventListener('touchend', () => {
            setTimeout(() => block.style.pointerEvents = 'auto', 50);
        });

        block.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
