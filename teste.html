<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .wrapper {
            width: 50vw;
            height: 95vh;
            position: relative;
            overflow: hidden;
        }

        .wrapper iframe {
            position: absolute;
            top: -64px;
            left: 0;
            width: 100%;
            height: calc(100% + 130px);
            border: none;
            background: transparent;
        }

        .zoom-block {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: transparent;
            cursor: grab;
        }
    </style>
</head>
<body>
    

    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</body>
</html>
